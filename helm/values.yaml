# Only one replica per bot token: a second poller gets 409 Conflict from Telegram
replicaCount: 1
# tag is set by CI (.github/workflows/cicd.yaml) on every push to develop
image:
  registry: ghcr.io
  repository: vystepanenko/gbot
  tag: v1.0.0-ce7828e
  os: linux
  arch: amd64
  pullPolicy: IfNotPresent
teleToken:
  secretName: gbot
  secretKey: token
nameOverride: ""
fullnameOverride: ""
