apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gbot.fullname" . }}
  labels:
    {{- include "gbot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gbot.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.image.repository }}/{{ .Chart.Name }}:{{ .Values.image.tag }}-{{ .Values.image.arch | default "amd64"}}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["start"]
          env:
            - name: TELE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.teleToken.secretName | quote }}
                  key: {{ .Values.teleToken.secretKey | quote }}
