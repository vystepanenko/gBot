name: gBot-CICD

on:
  push:
    branches:
      - develop

permissions: {}

concurrency:
  group: cicd-develop
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Makefile versioning uses git tags
          fetch-depth: 0
          # This job never pushes to git, keep the token out of .git/config
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Version
        id: version
        run: echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: make image push TARGETARCH=amd64

  cd:
    name: CD
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.ci.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update image tag in the Helm chart
        uses: mikefarah/yq@v4
        with:
          cmd: yq -i '.image.tag = strenv(VERSION)' helm/values.yaml

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Update image tag to $VERSION"
          git push
